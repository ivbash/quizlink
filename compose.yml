name: quizlink

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=quizlink
  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379

volumes:
  postgres-data:
